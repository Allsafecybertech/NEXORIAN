{% extends 'layout.html' %}
{% block content %}
<section class="container py-5">
  <h1 class="fw-bold mb-4">Countries</h1>
  <div class="row g-3">
    {% for country, count in country_rows %}
    <div class="col-md-3">
      <div class="card shadow-sm border-0 rounded-3 h-100">
        <div class="card-body">
          <h5 class="fw-bold">{{ country }}</h5>
          <p class="text-secondary mb-0">{{ count }} proxies</p>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
