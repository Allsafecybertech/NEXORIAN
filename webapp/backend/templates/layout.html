<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ getenv('BRAND_NAME') or 'NEXORIAN' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">NEXORIAN</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/plans">Plans</a></li>
            <li class="nav-item"><a class="nav-link" href="/proxy-library">Proxy Library</a></li>
            <li class="nav-item"><a class="nav-link" href="/countries">Countries</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/faq">FAQ</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
          </ul>
          <a class="btn btn-outline-light" href="/dashboard">Dashboard</a>
        </div>
      </div>
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="py-5 bg-dark text-light mt-5">
      <div class="container">
        <div class="row">
          <div class="col-md-6">
            <h5>NEXORIAN</h5>
            <p class="text-secondary">Professional proxy access, global listings, and subscription gateway.</p>
          </div>
          <div class="col-md-6 text-md-end">
            <a class="text-light me-3" href="/plans">Plans</a>
            <a class="text-light me-3" href="/proxy-library">Proxy Library</a>
            <a class="text-light" href="/contact">Contact</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
