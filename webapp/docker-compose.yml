version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - FLUTTERWAVE_SECRET_KEY
      - FLUTTERWAVE_PUBLIC_KEY
      - ETHERSCAN_API_KEY
      - BSCSCAN_API_KEY
      - BLOCKCYPHER_TOKEN
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - FROM_EMAIL
      - BRAND_NAME=NEXORIAN
    restart: unless-stopped
